name: build-eurobase
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.eurobase
      - nginx.conf.template
      - entrypoint-eurobase.sh
      - config.template.json
      - .github/workflows/build-eurobase.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eurobase
          push: true
          tags: ghcr.io/3a1n/xray-node:eurobase
          provenance: false
          sbom: false
